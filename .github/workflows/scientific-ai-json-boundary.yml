name: RADVORA Scientific and AI JSON Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard scientific and AI control media types
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const routes = [
            ['app/api/admin/labs/claims/[id]/route.ts', 'scientific claim governance'],
            ['app/api/admin/ai/approvals/[id]/route.ts', 'human approval decisions'],
            ['app/api/admin/ai/agents/[id]/route.ts', 'AI agent configuration'],
          ]
          for (const [path, label] of routes) {
            const source = fs.readFileSync(path, 'utf8')
            if (!source.includes("request.headers.get('content-type')") || !source.includes("startsWith('application/json')") || !source.includes("},415)")) {
              console.error(`Admin ${label} must reject non-JSON mutation requests with HTTP 415.`)
              process.exit(1)
            }
          }
          console.log('Scientific claims, human approvals and AI configuration require application/json.')
          NODE
