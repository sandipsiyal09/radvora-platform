name: RADVORA Production Health Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production health to fail closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('app/api/health/route.ts', 'utf8')
          const required = [
            'function canonicalProductionUrlReady(value:string|undefined)',
            "url.protocol==='https:'",
            '!url.username&&!url.password',
            "hostname!=='localhost'",
            '!isIpLiteral',
            "hostname.includes('.')",
            "(url.pathname==='/'||url.pathname==='')&&!url.search&&!url.hash",
            "(url.port===''||url.port==='443')",
            'const canonicalUrlReady=canonicalProductionUrlReady(process.env.NEXT_PUBLIC_APP_URL)',
            "release.environment==='production'&&!canonicalUrlReady",
            "'NEXT_PUBLIC_APP_URL'",
            'const configurationReady=missingRuntimeConfig.length===0',
            "const releaseProvenanceReady=release.environment!=='production'||(/^[0-9a-f]{40}$/i.test(release.commit)&&release.ref==='main')",
            'if(!releaseProvenanceReady)',
            "release_provenance:'unavailable'",
            "release_provenance:'verified'",
            ".eq('commerce_enabled',true)",
            'const commerceEnabledProducts=commerceEnabledProductCount||0',
            'const commerceActivationSafe=commerceEnabledProducts===0||(sellerReady===true&&indiaPaymentsConfigured)',
            "commerce_activation:'unsafe'",
            "commerce_activation:commerceEnabledProducts===0?'disabled':'ready'",
            "status:'degraded'",
            '{status:503,headers:responseHeaders()}',
          ]
          for (const snippet of required) {
            if (!source.includes(snippet)) {
              console.error(`Production health fail-closed control missing: ${snippet}`)
              process.exit(1)
            }
          }
          if (!source.includes("canonical_url:canonicalUrlReady?'configured':'not_configured'")) {
            console.error('Production health must expose only the canonical URL readiness state, never the configured URL value.')
            process.exit(1)
          }

          const monitor = fs.readFileSync('.github/workflows/production-health.yml', 'utf8')
          const monitorRequired = [
            'uses: actions/checkout@v4',
            'fetch-depth: 0',
            'health_url="${CONFIGURED_HEALTH_URL:-}"',
            'if [ -z "$health_url" ]; then',
            'PRODUCTION_HEALTH_URL repository variable must be explicitly configured',
            'HEALTH_URL="$health_url" node',
            "url.protocol === 'https:'",
            "url.pathname === '/api/health'",
            "hostname !== 'localhost' && !isIpLiteral",
            "!hostname.endsWith('.') && hostname.includes('.')",
            "(url.port === '' || url.port === '443')",
            ': > "$response_file"',
            '--dump-header "$headers_file"',
            "const cacheControl = (rawHeaders.match(/^cache-control:",
            "includes('no-store')",
            "const setCookiePresent = /^set-cookie:/im.test(rawHeaders)",
            'setCookieAbsent: !setCookiePresent',
            "fail('Production health response must remain stateless and must not set cookies.')",
            "const responseAgeMs = Date.now() - timestampMs",
            "responseAgeMs >= -60 * 1000 && responseAgeMs <= 5 * 60 * 1000",
            "fail('Production health response is missing Cache-Control: no-store.')",
            'timestamp is missing, invalid, stale, or implausibly in the future',
            "const { execFileSync } = require('child_process')",
            'const deploymentLag = validReportedCommit && reportedCommit !== expectedCommit',
            "execFileSync('git', ['cat-file', '-e', `${reportedCommit}^{commit}`]",
            "execFileSync('git', ['merge-base', '--is-ancestor', reportedCommit, expectedCommit]",
            'if (!reportedCommitKnown || !reportedCommitIsAncestor)',
            'if (deploymentLag)',
          ]
          for (const snippet of monitorRequired) {
            if (!monitor.includes(snippet)) {
              console.error(`Production health monitor contract missing: ${snippet}`)
              process.exit(1)
            }
          }
          if (monitor.includes('https://radvora-platform.vercel.app/api/health')) {
            console.error('Production health monitor must not fall back to a hard-coded deployment URL.')
            process.exit(1)
          }
          const deploymentLagIndex = monitor.indexOf('if (deploymentLag)')
          const ancestryIndex = monitor.indexOf('if (!reportedCommitKnown || !reportedCommitIsAncestor)')
          const responseContractIndex = monitor.indexOf("if (!safeDiagnostic.cacheControlNoStore)")
          if (deploymentLagIndex < 0 || ancestryIndex < 0 || responseContractIndex < 0 || deploymentLagIndex >= ancestryIndex || ancestryIndex >= responseContractIndex) {
            console.error('Production health must verify a reported lagging commit is a known ancestor before retrying and before enforcing version-specific response-contract checks.')
            process.exit(1)
          }
          console.log('Production health runtime and monitor fail closed for malformed origins, unsafe commerce activation, missing monitor configuration, untrusted endpoints, stale/future responses, cacheable responses, stateful cookie-setting responses, and divergent/unknown release SHAs while retrying only known prior main ancestors during deployment propagation.')
          NODE
