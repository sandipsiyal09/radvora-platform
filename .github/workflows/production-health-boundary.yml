name: RADVORA Production Health Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production health to fail closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('app/api/health/route.ts', 'utf8')
          const required = [
            'function canonicalProductionUrlReady(value:string|undefined,requestUrl:string)',
            'const request=new URL(requestUrl)',
            "url.protocol==='https:'",
            '!url.username&&!url.password',
            "hostname!=='localhost'",
            '!isIpLiteral',
            "hostname.includes('.')",
            "(url.pathname==='/'||url.pathname==='')&&!url.search&&!url.hash",
            "(url.port===''||url.port==='443')",
            "request.origin===url.origin&&request.pathname==='/api/health'",
            'export async function GET(request:Request)',
            'const canonicalUrlReady=canonicalProductionUrlReady(process.env.NEXT_PUBLIC_APP_URL,request.url)',
            "release.environment==='production'&&!canonicalUrlReady",
            "'NEXT_PUBLIC_APP_URL'",
            'const configurationReady=missingRuntimeConfig.length===0',
            "const releaseProvenanceReady=release.environment!=='production'||(/^[0-9a-f]{40}$/i.test(release.commit)&&release.ref==='main')",
            'if(!releaseProvenanceReady)',
            "release_provenance:'unavailable'",
            "release_provenance:'verified'",
            ".eq('commerce_enabled',true).limit(1000)",
            'const commerceEnabledProductsCount=commerceEnabledProductCount||0',
            'const enabledCatalog=commerceEnabledProducts||[]',
            'const completeEnabledCatalog=commerceEnabledProductsCount===enabledCatalog.length&&enabledCatalog.every(product=>{',
            "product.status==='active'",
            "product.currency==='INR'",
            'Number(product.price_inr)>0',
            '/^\\d{4,8}$/.test(String(product.hsn_code))',
            'Number(product.gst_rate)>=0&&Number(product.gst_rate)<=100',
            'product.price_inr_includes_gst!==null',
            'availableStock!==null&&availableStock>0',
            'const commerceActivationSafe=commerceEnabledProductsCount===0||(sellerReady===true&&indiaPaymentsConfigured&&completeEnabledCatalog)',
            "commerce_activation:'unsafe'",
            "commerce_activation:commerceEnabledProductsCount===0?'disabled':'ready'",
            "status:'degraded'",
            '{status:503,headers:responseHeaders()}',
          ]
          for (const snippet of required) {
            if (!source.includes(snippet)) {
              console.error(`Production health fail-closed control missing: ${snippet}`)
              process.exit(1)
            }
          }
          if (!source.includes("canonical_url:canonicalUrlReady?'configured':'not_configured'")) {
            console.error('Production health must expose only the canonical URL readiness state, never the configured URL value.')
            process.exit(1)
          }

          const monitor = fs.readFileSync('.github/workflows/production-health.yml', 'utf8')
          const monitorRequired = [
            'uses: actions/checkout@v4',
            'fetch-depth: 0',
            'health_url="${CONFIGURED_HEALTH_URL:-}"',
            'if [ -z "$health_url" ]; then',
            'PRODUCTION_HEALTH_URL repository variable must be explicitly configured',
            'HEALTH_URL="$health_url" node',
            "url.protocol === 'https:'",
            "url.pathname === '/api/health'",
            "hostname !== 'localhost' && !isIpLiteral",
            "!hostname.endsWith('.') && hostname.includes('.')",
            "(url.port === '' || url.port === '443')",
            ': > "$response_file"',
            '--dump-header "$headers_file"',
            "const cacheControl = (rawHeaders.match(/^cache-control:",
            "const pragma = (rawHeaders.match(/^pragma:",
            "const expires = (rawHeaders.match(/^expires:",
            "const contentTypeOptions = (rawHeaders.match(/^x-content-type-options:",
            "const cacheDirectives = cacheControl.split(',')",
            "cacheControlNoStore: cacheDirectives.includes('no-store')",
            "cacheControlMaxAgeZero: cacheDirectives.includes('max-age=0')",
            "pragmaNoCache: pragma === 'no-cache'",
            "expiresZero: expires === '0'",
            "contentTypeOptionsNoSniff: contentTypeOptions === 'nosniff'",
            "const contentType = (rawHeaders.match(/^content-type:",
            "const contentMediaType = contentType.split(';', 1)[0].trim()",
            "contentTypeJson: contentMediaType === 'application/json'",
            "fail('Production health response Content-Type must be application/json.')",
            "const setCookiePresent = /^set-cookie:/im.test(rawHeaders)",
            'setCookieAbsent: !setCookiePresent',
            "fail('Production health response must remain stateless and must not set cookies.')",
            "const responseAgeMs = Date.now() - timestampMs",
            "responseAgeMs >= -60 * 1000 && responseAgeMs <= 5 * 60 * 1000",
            "fail('Production health response must include Cache-Control: no-store, max-age=0.')",
            "fail('Production health response must include Pragma: no-cache.')",
            "fail('Production health response must include Expires: 0.')",
            "fail('Production health response must include X-Content-Type-Options: nosniff.')",
            'timestamp is missing, invalid, stale, or implausibly in the future',
            "const { execFileSync } = require('child_process')",
            'const deploymentLag = validReportedCommit && reportedCommit !== expectedCommit',
            "execFileSync('git', ['cat-file', '-e', `${reportedCommit}^{commit}`]",
            "execFileSync('git', ['merge-base', '--is-ancestor', reportedCommit, expectedCommit]",
            'if (!reportedCommitKnown || !reportedCommitIsAncestor)',
            'if (deploymentLag)',
            'const knownRuntimeConfigNames = new Set([',
            "'NEXT_PUBLIC_SUPABASE_URL'",
            "'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'",
            "'SUPABASE_SERVICE_ROLE_KEY'",
            "'NEXT_PUBLIC_APP_URL'",
            'const missingRuntimeConfigShapeValid = rawMissingRuntimeConfig.length === missingRuntimeConfig.length',
            'const allowedCheckValues = {',
            "india_payments: new Set(['live_configured', 'test_or_invalid_key', 'not_configured'])",
            "return typeof value === 'string' && allowedCheckValues[key].has(value) ? value : 'unexpected_or_missing'",
            'const safeChecks = Object.fromEntries(',
            'const checksShapeValid = Object.keys(rawChecks).every(key => knownCheckKeys.has(key))',
            "commit: validReportedCommit ? rawReportedCommit : 'invalid_or_missing'",
            "ref: rawRelease.ref === 'main' ? 'main' : 'unexpected_or_missing'",
            "environment: rawRelease.environment === 'production' ? 'production' : 'unexpected_or_missing'",
            'const diagnosticShapeValid = missingRuntimeConfigShapeValid && checksShapeValid',
            'diagnosticShapeValid',
            "if (!diagnosticShapeValid) fail('Production health diagnostic shape contains unknown or invalid fields.')",
          ]
          for (const snippet of monitorRequired) {
            if (!monitor.includes(snippet)) {
              console.error(`Production health monitor contract missing: ${snippet}`)
              process.exit(1)
            }
          }
          if (monitor.includes("contentType.startsWith('application/json')")) {
            console.error('Production health monitor must require the exact application/json media type, not a prefix match.')
            process.exit(1)
          }
          if (monitor.includes('https://radvora-platform.vercel.app/api/health')) {
            console.error('Production health monitor must not fall back to a hard-coded deployment URL.')
            process.exit(1)
          }
          const forbiddenRawDiagnostics = [
            'release: body.release || {}',
            'checks: body.checks || {}',
            'missingRuntimeConfig: Array.isArray(body.missingRuntimeConfig) ? body.missingRuntimeConfig : []'
          ]
          for (const snippet of forbiddenRawDiagnostics) {
            if (monitor.includes(snippet)) {
              console.error(`Production health monitor must not log unbounded server-provided diagnostic data: ${snippet}`)
              process.exit(1)
            }
          }
          const deploymentLagIndex = monitor.indexOf('if (deploymentLag)')
          const ancestryIndex = monitor.indexOf('if (!reportedCommitKnown || !reportedCommitIsAncestor)')
          const diagnosticShapeIndex = monitor.indexOf("if (!diagnosticShapeValid)")
          const responseContractIndex = monitor.indexOf("if (!safeDiagnostic.cacheControlNoStore || !safeDiagnostic.cacheControlMaxAgeZero)")
          if (deploymentLagIndex < 0 || ancestryIndex < 0 || diagnosticShapeIndex < 0 || responseContractIndex < 0 || deploymentLagIndex >= ancestryIndex || ancestryIndex >= diagnosticShapeIndex || diagnosticShapeIndex >= responseContractIndex) {
            console.error('Production health must verify a lagging commit ancestry before exact-version diagnostics, then reject unknown diagnostic shapes before enforcing the remaining response contract.')
            process.exit(1)
          }
          console.log('Production health runtime and monitor fail closed for malformed origins, non-canonical request origins, unsafe or incomplete commerce activation, missing monitor configuration, untrusted endpoints, stale/future responses, incomplete anti-cache or MIME-sniffing headers, malformed JSON media types, stateful cookie-setting responses, divergent/unknown release SHAs, and unknown/unbounded diagnostic shapes while retrying only known prior main ancestors during deployment propagation.')
          NODE
