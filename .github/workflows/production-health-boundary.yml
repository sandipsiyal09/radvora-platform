name: RADVORA Production Health Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production health to fail closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('app/api/health/route.ts', 'utf8')
          const required = [
            'function canonicalProductionUrlReady(value:string|undefined)',
            "url.protocol==='https:'",
            '!url.username&&!url.password',
            "hostname!=='localhost'",
            '!isIpLiteral',
            "hostname.includes('.')",
            "(url.pathname==='/'||url.pathname==='')&&!url.search&&!url.hash",
            "(url.port===''||url.port==='443')",
            'const canonicalUrlReady=canonicalProductionUrlReady(process.env.NEXT_PUBLIC_APP_URL)',
            "release.environment==='production'&&!canonicalUrlReady",
            "'NEXT_PUBLIC_APP_URL'",
            'const configurationReady=missingRuntimeConfig.length===0',
            "const releaseProvenanceReady=release.environment!=='production'||(/^[0-9a-f]{40}$/i.test(release.commit)&&release.ref==='main')",
            'if(!releaseProvenanceReady)',
            "release_provenance:'unavailable'",
            "release_provenance:'verified'",
            ".eq('commerce_enabled',true)",
            'const commerceEnabledProducts=commerceEnabledProductCount||0',
            'const commerceActivationSafe=commerceEnabledProducts===0||(sellerReady===true&&indiaPaymentsConfigured)',
            "commerce_activation:'unsafe'",
            "commerce_activation:commerceEnabledProducts===0?'disabled':'ready'",
            "status:'degraded'",
            '{status:503,headers:responseHeaders()}',
          ]
          for (const snippet of required) {
            if (!source.includes(snippet)) {
              console.error(`Production health fail-closed control missing: ${snippet}`)
              process.exit(1)
            }
          }
          if (!source.includes("canonical_url:canonicalUrlReady?'configured':'not_configured'")) {
            console.error('Production health must expose only the canonical URL readiness state, never the configured URL value.')
            process.exit(1)
          }

          const monitor = fs.readFileSync('.github/workflows/production-health.yml', 'utf8')
          const monitorRequired = [
            'HEALTH_URL="$health_url" node',
            "url.protocol === 'https:'",
            "url.pathname === '/api/health'",
            "hostname !== 'localhost' && !isIpLiteral",
            "!hostname.endsWith('.') && hostname.includes('.')",
            "(url.port === '' || url.port === '443')",
            '--dump-header "$headers_file"',
            "const cacheControl = (rawHeaders.match(/^cache-control:",
            "includes('no-store')",
            "fail('Production health response is missing Cache-Control: no-store.')",
          ]
          for (const snippet of monitorRequired) {
            if (!monitor.includes(snippet)) {
              console.error(`Production health monitor contract missing: ${snippet}`)
              process.exit(1)
            }
          }
          console.log('Production health runtime and monitor fail closed for malformed origins, unsafe commerce activation, untrusted monitor endpoints, and cacheable responses.')
          NODE
