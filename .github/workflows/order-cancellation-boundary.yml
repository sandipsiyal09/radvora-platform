name: RADVORA Order Cancellation Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  order-cancellation-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard authenticated order cancellation origin boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const routePath = 'app/api/orders/[id]/cancel/route.ts'
          const source = fs.readFileSync(routePath, 'utf8')
          const required = [
            "request.headers.get('sec-fetch-site')?.toLowerCase()==='cross-site'",
            'if(!origin)return true',
            'NEXT_PUBLIC_APP_URL',
            "process.env.VERCEL_ENV==='production'",
            "process.env.NODE_ENV==='production'&&!process.env.VERCEL_ENV",
            "url.protocol==='https:'&&!url.username&&!url.password",
            "hostname!=='localhost'",
            "!hostname.endsWith('.')",
            "hostname.includes('.')",
            "(url.pathname==='/'||url.pathname==='')",
            '!url.search',
            '!url.hash',
            "(url.port===''||url.port==='443')",
            'if(isProductionRuntime())return supplied!==canonical',
            "if(!expectedOrigin)return json({error:'Order cancellation is temporarily unavailable.'},503)",
            "Invalid cancellation request origin.",
            "supabase.auth.getUser()",
            "order.user_id!==user.id",
            "cancel_pending_order",
          ]
          for (const snippet of required) {
            if (!source.includes(snippet)) {
              console.error(`Order cancellation boundary is missing required control: ${snippet}`)
              process.exit(1)
            }
          }
          const forbidden = [
            'return supplied!==requestOrigin&&supplied!==canonical}catch{return true}',
            'return supplied!==requestOrigin&&supplied!==canonical}catch{return true}',
            "process.env.NEXT_PUBLIC_APP_URL?new URL(process.env.NEXT_PUBLIC_APP_URL).origin:requestOrigin",
          ]
          for (const snippet of forbidden) {
            if (source.includes(snippet)) {
              console.error(`Order cancellation production origin boundary regressed: ${snippet}`)
              process.exit(1)
            }
          }
          console.log('Order cancellation requires exact configured canonical origin in production, safe HTTPS canonical URL validation, authentication, ownership, and provider-authoritative reconciliation.')
          NODE
