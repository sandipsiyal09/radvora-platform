name: RADVORA Public Request Boundary

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard-public-request-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify public POST request boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          routes = [
              Path('app/api/business-leads/route.ts'),
              Path('app/api/product-verification/route.ts'),
          ]

          for route in routes:
              text = route.read_text()
              required = [
                  "function canonicalOrigin",
                  "function isProductionRuntime",
                  "function isSafeProductionOrigin",
                  "if (isProductionRuntime()) return isSafeProductionOrigin(url) ? url.origin : null",
                  "url.protocol === 'https:'",
                  "hostname !== 'localhost'",
                  "hostname.includes('.')",
                  "!url.username && !url.password",
                  "!url.search && !url.hash",
                  "url.port === '' || url.port === '443'",
                  "if (isProductionRuntime()) return supplied !== canonical",
                  "if (!expectedOrigin)",
                  "if (!origin) return true",
                  "sec-fetch-site",
                  "application/json",
                  "}, 415)",
                  "MAX_BODY_BYTES",
                  "Cache-Control",
                  "no-store",
              ]
              missing = [needle for needle in required if needle not in text]
              if missing:
                  raise SystemExit(f'{route}: missing public request boundary controls: {missing}')

              if "process.env.NEXT_PUBLIC_APP_URL ? new URL(process.env.NEXT_PUBLIC_APP_URL).origin : requestOrigin" in text:
                  raise SystemExit(f'{route}: production canonical origin regressed to request-host fallback')

          lead = routes[0].read_text()
          lead_required = [
              "export const runtime = 'nodejs'",
              "export const maxDuration = 10",
              "Number.isFinite(declaredLength)",
              "Array.isArray(parsedBody)",
              "'X-Content-Type-Options': 'nosniff'",
              "'Referrer-Policy': 'no-referrer'",
              "'Cross-Origin-Resource-Policy': 'same-origin'",
              "'X-Robots-Tag': 'noindex, nofollow, noarchive'",
              "console.error('business_lead_submission_failed', { component: 'leads', errorName })",
          ]
          missing_lead = [needle for needle in lead_required if needle not in lead]
          if missing_lead:
              raise SystemExit(f'business lead hardened runtime/response boundary regressed: {missing_lead}')
          if "console.error('business_lead_submission_failed', error)" in lead:
              raise SystemExit('business lead logging regressed to raw error-object output')
          if "clean(body.website, 200)" not in lead or "(count ?? 0) >= 3" not in lead:
              raise SystemExit('business lead anti-abuse controls regressed')

          consumer_interest_required = [
              "'shieldlab-interest'",
              "'product-interest'",
              "consumerInterest",
              "'consumer_interest'",
              "const context = clean(body.context, 240)",
              "Availability interest",
              "consumerInterest ? null : phone || null",
              "consumerInterest ? null : company || null",
          ]
          missing_consumer_interest = [needle for needle in consumer_interest_required if needle not in lead]
          if missing_consumer_interest:
              raise SystemExit(f'consumer availability-interest boundary regressed: {missing_consumer_interest}')

          verification = routes[1].read_text()
          verification_required = [
              'MAX_ATTEMPTS',
              'isRateLimited',
              'SERIAL_PATTERN',
              "export const runtime = 'nodejs'",
              "export const maxDuration = 10",
              "Number.isFinite(declaredLength)",
              "Array.isArray(parsedBody)",
              "'X-Content-Type-Options': 'nosniff'",
              "'Referrer-Policy': 'no-referrer'",
              "'Cross-Origin-Resource-Policy': 'same-origin'",
              "'X-Robots-Tag': 'noindex, nofollow, noarchive'",
              "console.error('product_verification_failed', { component: 'product_verification', errorName })",
          ]
          missing_verification = [needle for needle in verification_required if needle not in verification]
          if missing_verification:
              raise SystemExit(f'product verification hardened runtime/request boundary regressed: {missing_verification}')
          if "console.error('product_verification_failed', error)" in verification:
              raise SystemExit('product verification logging regressed to raw error-object output')

          print('Public request boundaries are guarded.')
          PY
