name: Privileged Admin JSON Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-json-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify privileged JSON request boundaries
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const routes = [
            ['app/api/admin/catalog/products/[id]/route.ts', 'catalog/tax/inventory controls'],
            ['app/api/admin/commerce/seller-profile/route.ts', 'seller identity updates'],
            ['app/api/admin/operations/transition/route.ts', 'Operations transitions'],
            ['app/api/admin/labs/claims/[id]/route.ts', 'scientific claim governance'],
            ['app/api/admin/ai/approvals/[id]/route.ts', 'human approval decisions'],
            ['app/api/admin/ai/agents/[id]/route.ts', 'AI agent configuration'],
          ]
          for (const [path, label] of routes) {
            const source = fs.readFileSync(path, 'utf8')
            if (!source.includes("request.headers.get('content-type')") || !source.includes("startsWith('application/json')")) {
              console.error(`Admin ${label} must require application/json.`)
              process.exit(1)
            }
            if (!source.includes("Unsupported media type.") || !source.includes(',415)')) {
              console.error(`Admin ${label} must fail closed with HTTP 415 for unsupported media types.`)
              process.exit(1)
            }
          }
          console.log('All privileged admin JSON mutation boundaries are enforced.')
          NODE
