name: RADVORA Production Health

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radvora-production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      CONFIGURED_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
      EXPECTED_PRODUCTION_COMMIT: ${{ github.sha }}
    steps:
      - name: Verify production health contract
        shell: bash
        run: |
          set -euo pipefail
          health_url="${CONFIGURED_HEALTH_URL:-https://radvora-platform.vercel.app/api/health}"
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file"' EXIT

          HEALTH_URL="$health_url" node - <<'NODE'
          const raw = String(process.env.HEALTH_URL || '').trim()
          try {
            const url = new URL(raw)
            const hostname = url.hostname.toLowerCase()
            const isIpLiteral = /^(?:\d{1,3}\.){3}\d{1,3}$/.test(hostname) || hostname.includes(':')
            const valid = url.protocol === 'https:' &&
              !url.username && !url.password &&
              hostname !== 'localhost' && !isIpLiteral &&
              !hostname.endsWith('.') && hostname.includes('.') &&
              url.pathname === '/api/health' && !url.search && !url.hash &&
              (url.port === '' || url.port === '443')
            if (!valid) throw new Error('unsafe production health URL')
          } catch {
            console.error('PRODUCTION_HEALTH_URL must be a clean HTTPS /api/health endpoint on a DNS hostname, without credentials, query, fragment, IP literal, localhost, trailing-dot host, or non-standard port.')
            process.exit(1)
          }
          NODE

          for attempt in $(seq 1 18); do
            : > "$headers_file"
            http_status="$(curl --silent --show-error --max-time 20 \
              --header 'Accept: application/json' \
              --dump-header "$headers_file" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$health_url" || true)"

            set +e
            HEALTH_RESPONSE="$(cat "$response_file")" HEALTH_RESPONSE_HEADERS="$(cat "$headers_file")" HEALTH_HTTP_STATUS="$http_status" node - <<'NODE'
          const raw = process.env.HEALTH_RESPONSE || ''
          const rawHeaders = process.env.HEALTH_RESPONSE_HEADERS || ''
          const httpStatus = String(process.env.HEALTH_HTTP_STATUS || '000')
          const requiredSchema = '202609110050'
          const expectedCommit = String(process.env.EXPECTED_PRODUCTION_COMMIT || '').trim()
          let body
          try {
            body = JSON.parse(raw)
          } catch {
            console.error(`Production health returned non-JSON response (HTTP ${httpStatus}).`)
            process.exit(2)
          }

          const cacheControl = (rawHeaders.match(/^cache-control:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase()
          const safeDiagnostic = {
            httpStatus,
            status: body.status || 'missing',
            runtimeSchemaVersion: body.runtimeSchemaVersion || 'missing',
            expectedRuntimeSchemaVersion: body.expectedRuntimeSchemaVersion || 'missing',
            release: body.release || {},
            missingRuntimeConfig: Array.isArray(body.missingRuntimeConfig) ? body.missingRuntimeConfig : [],
            checks: body.checks || {},
            cacheControlNoStore: cacheControl.split(',').map(value => value.trim()).includes('no-store')
          }

          const fail = (message, retryable = false) => {
            console.error(message)
            console.error(`Safe health diagnostic: ${JSON.stringify(safeDiagnostic)}`)
            process.exit(retryable ? 2 : 1)
          }

          if (!/^[0-9a-f]{40}$/i.test(expectedCommit)) fail('Expected production commit metadata is invalid.')
          if (!safeDiagnostic.cacheControlNoStore) fail('Production health response is missing Cache-Control: no-store.')

          const reportedCommit = String(body.release?.commit || '').trim()
          const validReportedCommit = /^[0-9a-f]{40}$/i.test(reportedCommit)
          const deploymentLag = validReportedCommit && reportedCommit !== expectedCommit
          if (deploymentLag) {
            fail(`Production commit ${reportedCommit} does not match workflow commit ${expectedCommit}.`, true)
          }

          if (safeDiagnostic.missingRuntimeConfig.length > 0) {
            fail(`Production runtime configuration is incomplete: ${safeDiagnostic.missingRuntimeConfig.join(', ')}.`)
          }
          if (body.checks?.canonical_url === 'not_configured') fail('Canonical production URL is not configured.')

          if (httpStatus !== '200') {
            const transientStatus = httpStatus === '000' || /^5\d\d$/.test(httpStatus)
            fail(`Production health returned HTTP ${httpStatus}.`, transientStatus)
          }
          if (body.status !== 'ok') fail(`Production health status is ${body.status || 'missing'}.`)
          if (body.runtimeSchemaVersion !== requiredSchema) {
            fail(`Runtime schema ${body.runtimeSchemaVersion || 'missing'} does not match ${requiredSchema}.`)
          }
          if (body.checks?.database !== 'ok' || body.checks?.commerce_schema !== 'ok' || body.checks?.payment_session_schema !== 'ok') {
            fail('Production database/schema health checks are not green.')
          }
          if (!['disabled','ready'].includes(body.checks?.commerce_activation)) {
            fail(`Commerce activation safety is ${body.checks?.commerce_activation || 'missing'}.`)
          }
          if (body.checks?.canonical_url !== 'configured') fail('Canonical production URL is not configured.')
          if (body.release?.environment !== 'production') {
            fail(`Health endpoint is not reporting production environment: ${body.release?.environment || 'missing'}.`)
          }
          if (body.release?.ref !== 'main') {
            fail(`Production health endpoint is not reporting the main branch: ${body.release?.ref || 'missing'}.`)
          }
          if (!validReportedCommit) fail('Production release commit metadata is unavailable or invalid.')
          if (reportedCommit !== expectedCommit) {
            fail(`Production commit ${reportedCommit} does not match workflow commit ${expectedCommit}.`, true)
          }
          console.log(`RADVORA production healthy at exact commit ${reportedCommit}, schema ${body.runtimeSchemaVersion}.`)
          console.log(`Commerce activation safety=${body.checks?.commerce_activation}; seller=${body.checks?.seller_profile}, payments=${body.checks?.india_payments}.`)
          NODE
            verdict=$?
            set -e

            if [ "$verdict" -eq 0 ]; then
              exit 0
            fi
            if [ "$verdict" -eq 1 ]; then
              echo "Production health reported a terminal release/configuration blocker; not retrying deployment promotion." >&2
              exit 1
            fi

            if [ "$attempt" -lt 18 ]; then
              echo "Production has not reached a conclusive healthy state yet (attempt $attempt/18); retrying in 10s."
              sleep 10
            fi
          done

          echo "Production health did not converge to the expected main commit within the release verification window." >&2
          exit 1
