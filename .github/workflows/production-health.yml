name: RADVORA Production Health

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radvora-production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      CONFIGURED_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
      EXPECTED_PRODUCTION_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout production history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production health contract
        shell: bash
        run: |
          set -euo pipefail
          health_url="${CONFIGURED_HEALTH_URL:-}"
          if [ -z "$health_url" ]; then
            echo "PRODUCTION_HEALTH_URL repository variable must be explicitly configured to the canonical production /api/health endpoint." >&2
            exit 1
          fi
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file"' EXIT

          HEALTH_URL="$health_url" node - <<'NODE'
          const raw = String(process.env.HEALTH_URL || '').trim()
          try {
            const url = new URL(raw)
            const hostname = url.hostname.toLowerCase()
            const isIpLiteral = /^(?:\d{1,3}\.){3}\d{1,3}$/.test(hostname) || hostname.includes(':')
            const valid = url.protocol === 'https:' &&
              !url.username && !url.password &&
              hostname !== 'localhost' && !isIpLiteral &&
              !hostname.endsWith('.') && hostname.includes('.') &&
              url.pathname === '/api/health' && !url.search && !url.hash &&
              (url.port === '' || url.port === '443')
            if (!valid) throw new Error('unsafe production health URL')
          } catch {
            console.error('PRODUCTION_HEALTH_URL must be a clean HTTPS /api/health endpoint on a DNS hostname, without credentials, query, fragment, IP literal, localhost, trailing-dot host, or non-standard port.')
            process.exit(1)
          }
          NODE

          for attempt in $(seq 1 18); do
            : > "$response_file"
            : > "$headers_file"
            http_status="$(curl --silent --show-error --max-time 20 \
              --header 'Accept: application/json' \
              --dump-header "$headers_file" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$health_url" || true)"

            set +e
            HEALTH_RESPONSE="$(cat "$response_file")" HEALTH_RESPONSE_HEADERS="$(cat "$headers_file")" HEALTH_HTTP_STATUS="$http_status" node - <<'NODE'
          const { execFileSync } = require('child_process')
          const raw = process.env.HEALTH_RESPONSE || ''
          const rawHeaders = process.env.HEALTH_RESPONSE_HEADERS || ''
          const httpStatus = String(process.env.HEALTH_HTTP_STATUS || '000')
          const requiredSchema = '202609140052'
          const expectedCommit = String(process.env.EXPECTED_PRODUCTION_COMMIT || '').trim()
          let body
          try {
            body = JSON.parse(raw)
          } catch {
            console.error(`Production health returned non-JSON response (HTTP ${httpStatus}).`)
            process.exit(2)
          }

          const knownRuntimeConfigNames = new Set([
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'NEXT_PUBLIC_APP_URL'
          ])
          const rawMissingRuntimeConfig = Array.isArray(body.missingRuntimeConfig) ? body.missingRuntimeConfig : []
          const missingRuntimeConfig = rawMissingRuntimeConfig.filter(value => typeof value === 'string' && knownRuntimeConfigNames.has(value))
          const missingRuntimeConfigShapeValid = rawMissingRuntimeConfig.length === missingRuntimeConfig.length

          const rawRelease = body.release && typeof body.release === 'object' && !Array.isArray(body.release) ? body.release : {}
          const rawChecks = body.checks && typeof body.checks === 'object' && !Array.isArray(body.checks) ? body.checks : {}
          const allowedCheckValues = {
            configuration: new Set(['ok', 'unavailable']),
            release_provenance: new Set(['verified', 'unavailable']),
            database: new Set(['ok', 'not_checked', 'unavailable_or_schema_mismatch']),
            commerce_schema: new Set(['ok', 'not_checked', 'unavailable_or_outdated']),
            commerce_activation: new Set(['disabled', 'ready', 'unsafe', 'not_checked']),
            payment_session_schema: new Set(['ok', 'not_checked', 'unavailable_or_outdated']),
            seller_profile: new Set(['configured', 'not_configured', 'not_checked', 'unavailable_or_outdated']),
            runtime_schema_version: new Set(['ok', 'not_checked', 'mismatch_or_unavailable']),
            canonical_url: new Set(['configured', 'not_configured']),
            india_payments: new Set(['live_configured', 'test_or_invalid_key', 'not_configured'])
          }
          const knownCheckKeys = new Set(Object.keys(allowedCheckValues))
          const safeCheck = key => {
            const value = rawChecks[key]
            return typeof value === 'string' && allowedCheckValues[key].has(value) ? value : 'unexpected_or_missing'
          }
          const safeChecks = Object.fromEntries(Object.keys(allowedCheckValues).map(key => [key, safeCheck(key)]))
          const checksShapeValid = Object.keys(rawChecks).every(key => knownCheckKeys.has(key)) &&
            Object.values(safeChecks).every(value => value !== 'unexpected_or_missing')

          const rawReportedCommit = typeof rawRelease.commit === 'string' ? rawRelease.commit.trim() : ''
          const validReportedCommit = /^[0-9a-f]{40}$/i.test(rawReportedCommit)
          const safeRelease = {
            commit: validReportedCommit ? rawReportedCommit : 'invalid_or_missing',
            ref: rawRelease.ref === 'main' ? 'main' : 'unexpected_or_missing',
            environment: rawRelease.environment === 'production' ? 'production' : 'unexpected_or_missing'
          }

          const cacheControl = (rawHeaders.match(/^cache-control:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase()
          const pragma = (rawHeaders.match(/^pragma:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const expires = (rawHeaders.match(/^expires:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const contentTypeOptions = (rawHeaders.match(/^x-content-type-options:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const robotsTag = (rawHeaders.match(/^x-robots-tag:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const referrerPolicy = (rawHeaders.match(/^referrer-policy:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const crossOriginResourcePolicy = (rawHeaders.match(/^cross-origin-resource-policy:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const frameOptions = (rawHeaders.match(/^x-frame-options:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const permissionsPolicy = (rawHeaders.match(/^permissions-policy:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const contentSecurityPolicy = (rawHeaders.match(/^content-security-policy:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase().trim()
          const contentType = (rawHeaders.match(/^content-type:\s*([^\r\n]+)/im)?.[1] || '').toLowerCase()
          const contentMediaType = contentType.split(';', 1)[0].trim()
          const setCookiePresent = /^set-cookie:/im.test(rawHeaders)
          const cacheDirectives = cacheControl.split(',').map(value => value.trim()).filter(Boolean)
          const timestampMs = Date.parse(String(body.timestamp || ''))
          const responseAgeMs = Date.now() - timestampMs
          const responseTimestampFresh = Number.isFinite(timestampMs) && responseAgeMs >= -60 * 1000 && responseAgeMs <= 5 * 60 * 1000
          const diagnosticShapeValid = missingRuntimeConfigShapeValid && checksShapeValid
          const safeDiagnostic = {
            httpStatus,
            status: body.status === 'ok' || body.status === 'degraded' ? body.status : 'unexpected_or_missing',
            runtimeSchemaVersion: body.runtimeSchemaVersion === requiredSchema ? requiredSchema : 'missing_or_unexpected',
            expectedRuntimeSchemaVersion: body.expectedRuntimeSchemaVersion === requiredSchema ? requiredSchema : 'missing_or_unexpected',
            release: safeRelease,
            missingRuntimeConfig,
            checks: safeChecks,
            cacheControlNoStore: cacheDirectives.includes('no-store'),
            cacheControlMaxAgeZero: cacheDirectives.includes('max-age=0'),
            pragmaNoCache: pragma === 'no-cache',
            expiresZero: expires === '0',
            contentTypeOptionsNoSniff: contentTypeOptions === 'nosniff',
            robotsTagPrivate: robotsTag === 'noindex, nofollow, noarchive',
            referrerPolicyNoReferrer: referrerPolicy === 'no-referrer',
            crossOriginResourcePolicySameOrigin: crossOriginResourcePolicy === 'same-origin',
            frameOptionsDeny: frameOptions === 'deny',
            permissionsPolicyRestricted: permissionsPolicy === 'camera=(), microphone=(), geolocation=(), payment=(), usb=()',
            contentSecurityPolicyIsolated: contentSecurityPolicy === "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'",
            contentTypeJson: contentMediaType === 'application/json',
            setCookieAbsent: !setCookiePresent,
            responseTimestampFresh,
            diagnosticShapeValid
          }

          const fail = (message, retryable = false) => {
            console.error(message)
            console.error(`Safe health diagnostic: ${JSON.stringify(safeDiagnostic)}`)
            process.exit(retryable ? 2 : 1)
          }

          if (!/^[0-9a-f]{40}$/i.test(expectedCommit)) fail('Expected production commit metadata is invalid.')

          // Only a known ancestor of the expected main commit is valid deployment propagation lag.
          // A divergent, future, or unknown SHA must fail closed instead of consuming the retry window.
          const reportedCommit = rawReportedCommit
          const deploymentLag = validReportedCommit && reportedCommit !== expectedCommit
          if (deploymentLag) {
            let reportedCommitKnown = false
            let reportedCommitIsAncestor = false
            try {
              execFileSync('git', ['cat-file', '-e', `${reportedCommit}^{commit}`], { stdio: 'ignore' })
              reportedCommitKnown = true
              execFileSync('git', ['merge-base', '--is-ancestor', reportedCommit, expectedCommit], { stdio: 'ignore' })
              reportedCommitIsAncestor = true
            } catch {}
            if (!reportedCommitKnown || !reportedCommitIsAncestor) {
              fail(`Production reported commit ${safeRelease.commit} is not a known ancestor of expected main commit ${expectedCommit}.`)
            }
            fail(`Production commit ${safeRelease.commit} is a known prior main commit and has not yet reached workflow commit ${expectedCommit}.`, true)
          }

          if (!diagnosticShapeValid) fail('Production health diagnostic shape contains unknown or invalid fields.')
          if (!safeDiagnostic.cacheControlNoStore || !safeDiagnostic.cacheControlMaxAgeZero) fail('Production health response must include Cache-Control: no-store, max-age=0.')
          if (!safeDiagnostic.pragmaNoCache) fail('Production health response must include Pragma: no-cache.')
          if (!safeDiagnostic.expiresZero) fail('Production health response must include Expires: 0.')
          if (!safeDiagnostic.contentTypeOptionsNoSniff) fail('Production health response must include X-Content-Type-Options: nosniff.')
          if (!safeDiagnostic.robotsTagPrivate) fail('Production health response must include X-Robots-Tag: noindex, nofollow, noarchive.')
          if (!safeDiagnostic.referrerPolicyNoReferrer) fail('Production health response must include Referrer-Policy: no-referrer.')
          if (!safeDiagnostic.crossOriginResourcePolicySameOrigin) fail('Production health response must include Cross-Origin-Resource-Policy: same-origin.')
          if (!safeDiagnostic.frameOptionsDeny) fail('Production health response must include X-Frame-Options: DENY.')
          if (!safeDiagnostic.permissionsPolicyRestricted) fail('Production health response must include the restrictive Permissions-Policy.')
          if (!safeDiagnostic.contentSecurityPolicyIsolated) fail('Production health response must include the hardened browser-isolation Content-Security-Policy.')
          if (!safeDiagnostic.contentTypeJson) fail('Production health response Content-Type must be application/json.')
          if (!safeDiagnostic.setCookieAbsent) fail('Production health response must remain stateless and must not set cookies.')
          if (body.service !== 'radvora-platform') fail('Production health response service identity is invalid.')
          if (body.expectedRuntimeSchemaVersion !== requiredSchema) fail('Production health response schema contract is invalid.')
          if (!safeDiagnostic.responseTimestampFresh) fail('Production health response timestamp is missing, invalid, stale, or implausibly in the future.')

          if (safeDiagnostic.missingRuntimeConfig.length > 0) {
            fail(`Production runtime configuration is incomplete: ${safeDiagnostic.missingRuntimeConfig.join(', ')}.`)
          }
          if (safeChecks.canonical_url === 'not_configured') fail('Canonical production URL is not configured.')

          if (httpStatus !== '200') {
            const transientStatus = httpStatus === '000' || /^5\d\d$/.test(httpStatus)
            fail(`Production health returned HTTP ${httpStatus}.`, transientStatus)
          }
          if (body.status !== 'ok') fail(`Production health status is ${safeDiagnostic.status}.`)
          if (body.runtimeSchemaVersion !== requiredSchema) {
            fail(`Runtime schema ${safeDiagnostic.runtimeSchemaVersion} does not match ${requiredSchema}.`)
          }
          if (safeChecks.database !== 'ok' || safeChecks.commerce_schema !== 'ok' || safeChecks.payment_session_schema !== 'ok') {
            fail('Production database/schema health checks are not green.')
          }
          if (!['disabled','ready'].includes(safeChecks.commerce_activation)) {
            fail(`Commerce activation safety is ${safeChecks.commerce_activation}.`)
          }
          if (safeChecks.canonical_url !== 'configured') fail('Canonical production URL is not configured.')
          if (rawRelease.environment !== 'production') {
            fail(`Health endpoint is not reporting production environment: ${safeRelease.environment}.`)
          }
          if (rawRelease.ref !== 'main') {
            fail(`Production health endpoint is not reporting the main branch: ${safeRelease.ref}.`)
          }
          if (!validReportedCommit) fail('Production release commit metadata is unavailable or invalid.')
          if (reportedCommit !== expectedCommit) {
            fail(`Production commit ${safeRelease.commit} does not match workflow commit ${expectedCommit}.`, true)
          }
          console.log(`RADVORA production healthy at exact commit ${reportedCommit}, schema ${body.runtimeSchemaVersion}.`)
          console.log(`Commerce activation safety=${safeChecks.commerce_activation}; seller=${safeChecks.seller_profile}, payments=${safeChecks.india_payments}.`)
          NODE
            verdict=$?
            set -e

            if [ "$verdict" -eq 0 ]; then
              exit 0
            fi
            if [ "$verdict" -eq 1 ]; then
              echo "Production health reported a terminal release/configuration blocker; not retrying deployment promotion." >&2
              exit 1
            fi

            if [ "$attempt" -lt 18 ]; then
              echo "Production has not reached a conclusive healthy state yet (attempt $attempt/18); retrying in 10s."
              sleep 10
            fi
          done

          echo "Production health did not converge to the expected main commit within the release verification window." >&2
          exit 1
