name: RADVORA Auth Callback Boundary

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard-auth-callback-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify auth callback and magic-link trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          callback = Path('app/auth/callback/route.ts').read_text()
          callback_required = [
              "MAX_AUTH_CODE_LENGTH",
              "process.env.VERCEL_ENV === 'production'",
              "process.env.NODE_ENV === 'production' && !process.env.VERCEL_ENV",
              "return null",
              "code.length > MAX_AUTH_CODE_LENGTH",
              "destination.origin !== origin",
              "destination.username",
              "destination.password",
              "private, no-store, max-age=0",
          ]
          missing = [needle for needle in callback_required if needle not in callback]
          if missing:
              raise SystemExit(f'auth callback boundary controls regressed: {missing}')
          if "return requestUrl.origin" in callback:
              raise SystemExit('auth callback must not unconditionally trust request-derived origins')

          magic_link = Path('app/api/auth/magic-link/route.ts').read_text()
          magic_required = [
              "export const runtime='nodejs'",
              "export const maxDuration=10",
              "function isProductionRuntime()",
              "function isSafeProductionOrigin(url:URL)",
              "url.protocol==='https:'",
              "!url.username",
              "!url.password",
              "hostname!=='localhost'",
              "!hostname.endsWith('.')",
              "hostname.includes('.')",
              "!url.search",
              "!url.hash",
              "url.port===''||url.port==='443'",
              "if(isProductionRuntime())return isSafeProductionOrigin(url)?url.origin:null",
              "if(isProductionRuntime())return supplied!==canonical",
              "if(!expectedOrigin)return json({error:'Authentication is temporarily unavailable.'},503)",
              "if(!origin)return true",
              "startsWith('application/json')",
              "MAX_BODY_BYTES=2048",
              "Number.isFinite(declaredLength)",
              "Array.isArray(parsedBody)",
              "'X-Content-Type-Options':'nosniff'",
              "'Referrer-Policy':'no-referrer'",
              "'Cross-Origin-Resource-Policy':'same-origin'",
              "'X-Robots-Tag':'noindex, nofollow, noarchive'",
              "email.length>254",
              "emailRedirectTo:callbackUrl",
              "const errorStatus='status' in error&&typeof error.status==='number'?error.status:null",
              "const errorCode='code' in error&&typeof error.code==='string'?error.code:null",
              "console.error('passwordless_login_request_failed',{component:'auth_magic_link',errorName,errorStatus,errorCode})",
              "if(errorStatus===429)return json({error:'Too many sign-in attempts. Please wait a few minutes and try again.'},429)",
          ]
          missing = [needle for needle in magic_required if needle not in magic_link]
          if missing:
              raise SystemExit(f'magic-link request boundary controls regressed: {missing}')
          if "console.error('passwordless_login_request_failed',{message:error.message})" in magic_link:
              raise SystemExit('magic-link logging regressed to provider error-message output')

          # The request-derived origin fallback is intentional outside production only.
          # Guard the production branch explicitly instead of forbidding the fallback text globally.
          production_guard = "if(isProductionRuntime())return supplied!==canonical"
          fallback_guard = "return supplied!==canonical&&supplied!==requestOrigin"
          if magic_link.find(production_guard) == -1 or magic_link.find(fallback_guard) == -1:
              raise SystemExit('magic-link origin branch ordering regressed')
          if magic_link.find(production_guard) > magic_link.find(fallback_guard):
              raise SystemExit('production canonical-origin check must run before non-production request-origin fallback')
          if "if(url.protocol==='https:'||url.hostname==='localhost')return url.origin\n    }catch" in magic_link:
              raise SystemExit('magic-link production canonical URL validation regressed')

          print('Auth callback and magic-link origin boundaries are guarded.')
          PY
