name: RADVORA Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kugawqpvfikynithyefa.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RwaaDUGHYP0D7za9Mo8xvg_A9sNhfim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration versions
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort \
            | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate Supabase migration versions detected:"
            echo "$duplicates"
            exit 1
          fi

      - name: Enforce India-only payment runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude='*.map' --exclude-dir='.next' --exclude-dir='node_modules' \
            'STRIPE_|from ["'"']stripe["'"']|require\(["'"']stripe["'"']\)|/api/(checkout|webhooks)/stripe' \
            app lib package.json .env.example 2>/dev/null; then
            echo "Stripe runtime/configuration references are not allowed in the India-only RADVORA application."
            exit 1
          fi
          if node -e "const p=require('./package.json');const d={...(p.dependencies||{}),...(p.devDependencies||{})};process.exit(Object.prototype.hasOwnProperty.call(d,'stripe')?1:0)"; then
            echo "India-only payment runtime check passed."
          else
            echo "The stripe package must not be present in package.json."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
