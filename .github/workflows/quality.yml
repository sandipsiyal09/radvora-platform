name: RADVORA Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration versions and runtime markers
        shell: bash
        run: |
          set -euo pipefail
          versions=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort)
          duplicates=$(printf '%s\n' "$versions" | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate Supabase migration versions detected:"
            echo "$duplicates"
            exit 1
          fi
          latest=$(printf '%s\n' "$versions" | tail -1)
          node - "$latest" <<'NODE'
          const fs = require('fs')
          const latest = process.argv[2]
          const files = ['app/api/health/route.ts', 'app/admin/readiness/page.tsx']
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8')
            const match = source.match(/EXPECTED_RUNTIME_SCHEMA_VERSION='([0-9]+)'/)
            if (!match) {
              console.error(`${file} does not declare EXPECTED_RUNTIME_SCHEMA_VERSION.`)
              process.exit(1)
            }
            if (match[1] !== latest) {
              console.error(`${file} runtime schema marker ${match[1]} does not match latest migration ${latest}.`)
              process.exit(1)
            }
          }
          console.log(`Runtime schema markers match latest migration: ${latest}`)
          NODE

      - name: Enforce India-only payment runtime
        shell: bash
        run: |
          set -euo pipefail
          for forbidden in 'STRIPE_' '/api/checkout/stripe' '/api/webhooks/stripe'; do
            if grep -RniF --exclude='*.map' --exclude-dir='.next' --exclude-dir='node_modules' \
              "$forbidden" app lib package.json .env.example 2>/dev/null; then
              echo "Forbidden Stripe runtime/configuration reference found: $forbidden"
              exit 1
            fi
          done
          node - <<'NODE'
          const p = require('./package.json')
          const deps = { ...(p.dependencies || {}), ...(p.devDependencies || {}) }
          if (Object.prototype.hasOwnProperty.call(deps, 'stripe')) {
            console.error('The stripe package must not be present in package.json.')
            process.exit(1)
          }
          console.log('India-only payment runtime check passed.')
          NODE

      - name: Guard private response and release observability controls
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const proxy = fs.readFileSync('proxy.ts', 'utf8')
          const health = fs.readFileSync('app/api/health/route.ts', 'utf8')
          const requiredProxySnippets = [
            "response.headers.set('X-Request-ID', requestId)",
            "response.headers.set('Cache-Control', 'private, no-store, max-age=0')",
            "response.headers.set('X-Robots-Tag', 'noindex, nofollow, noarchive')",
            "requestHeaders.set('x-request-id', requestId)",
            'const requestId = crypto.randomUUID()',
            "'/auth/callback'",
          ]
          for (const snippet of requiredProxySnippets) {
            if (!proxy.includes(snippet)) {
              console.error(`Missing private-response/request-tracing control: ${snippet}`)
              process.exit(1)
            }
          }
          if (proxy.includes("request.headers.get('x-request-id')")) {
            console.error('Proxy must generate correlation IDs server-side and must not trust caller-supplied X-Request-ID values.')
            process.exit(1)
          }
          const requiredHealthSnippets = [
            'VERCEL_GIT_COMMIT_SHA',
            'VERCEL_GIT_COMMIT_REF',
            'VERCEL_ENV',
            'releaseMetadata()',
          ]
          for (const snippet of requiredHealthSnippets) {
            if (!health.includes(snippet)) {
              console.error(`Missing deployment release metadata control: ${snippet}`)
              process.exit(1)
            }
          }
          console.log('Private response, trusted request tracing and release observability controls are present.')
          NODE

      - name: Guard auth callback redirect safety
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('app/auth/callback/route.ts', 'utf8')
          const required = [
            'NEXT_PUBLIC_APP_URL',
            'destination.origin !== origin',
            "return NextResponse.redirect(destination)",
            "/[\\\\\\u0000-\\u001f\\u007f]/",
          ]
          for (const snippet of required) {
            if (!source.includes(snippet)) {
              console.error(`Auth callback redirect hardening is missing required control: ${snippet}`)
              process.exit(1)
            }
          }
          if (source.includes("value.startsWith('/')") && !source.includes('destination.origin !== origin')) {
            console.error('Auth callback must validate the resolved destination origin, not only the raw path prefix.')
            process.exit(1)
          }
          console.log('Auth callback same-origin redirect controls are present.')
          NODE

      - name: Guard passwordless login request boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const routePath = 'app/api/auth/magic-link/route.ts'
          if (!fs.existsSync(routePath)) {
            console.error(`Missing passwordless login server route: ${routePath}`)
            process.exit(1)
          }
          const route = fs.readFileSync(routePath, 'utf8')
          const login = fs.readFileSync('app/login/page.tsx', 'utf8')
          const requiredRoute = [
            "request.headers.get('sec-fetch-site')?.toLowerCase()==='cross-site'",
            'if(!origin)return true',
            'MAX_BODY_BYTES=2048',
            "startsWith('application/json')",
            'NEXT_PUBLIC_APP_URL',
            'signInWithOtp',
            'emailRedirectTo:callbackUrl',
          ]
          for (const snippet of requiredRoute) {
            if (!route.includes(snippet)) {
              console.error(`Passwordless login boundary is missing required control: ${snippet}`)
              process.exit(1)
            }
          }
          if (!login.includes("fetch('/api/auth/magic-link'") || login.includes('signInWithOtp')) {
            console.error('Login UI must request magic links through the bounded server route, not call Supabase Auth directly.')
            process.exit(1)
          }
          console.log('Passwordless login server-boundary controls are present.')
          NODE

      - name: Guard admin payment request origins
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const reconcile = fs.readFileSync('app/api/admin/payments/[id]/reconcile/route.ts', 'utf8')
          const refund = fs.readFileSync('app/api/admin/orders/[id]/refund/route.ts', 'utf8')
          const required = [
            [reconcile, 'if(!origin)return true', 'payment reconciliation'],
            [refund, "if(!origin) return json({error:'Invalid refund request origin.'},403)", 'refund submission'],
          ]
          for (const [source, snippet, label] of required) {
            if (!source.includes(snippet)) {
              console.error(`Admin ${label} must reject requests with a missing Origin header.`)
              process.exit(1)
            }
            if (!source.includes("sec-fetch-site") || !source.includes('NEXT_PUBLIC_APP_URL')) {
              console.error(`Admin ${label} is missing cross-site or canonical-origin validation.`)
              process.exit(1)
            }
          }
          console.log('Admin payment/refund routes require explicit trusted origins.')
          NODE

      - name: Guard post-deploy privilege lockdown
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const path = 'supabase/postdeploy/lock_down_legacy_client_writes.sql'
          if (!fs.existsSync(path)) {
            console.error(`Missing required post-deploy privilege lockdown: ${path}`)
            process.exit(1)
          }
          const sql = fs.readFileSync(path, 'utf8')
          const requiredSnippets = [
            'revoke execute on function public.checkout_active_cart() from authenticated;',
            'revoke insert on table public.orders from authenticated;',
            'revoke insert on table public.order_items from authenticated;',
            'revoke insert on table public.product_registrations from authenticated;',
            'revoke insert, update on table public.products from authenticated;',
            "'update_product_catalog'",
            "'set_product_commerce_enabled'",
            "'set_product_india_tax_config'",
            "'set_product_inventory'",
            'revoke insert, update on table public.support_tickets from authenticated;',
            'revoke insert, update on table public.warranty_claims from authenticated;',
            "'transition_order_fulfillment'",
            "'transition_support_ticket'",
            "'transition_warranty_claim'",
            'revoke execute on function public.review_claim(uuid,text,text,text) from authenticated;',
            'revoke execute on function public.publish_claim(uuid) from authenticated;',
            'revoke execute on function public.decide_approval(uuid,text,text) from authenticated;',
            'revoke execute on function public.set_agent_configuration(uuid,boolean,smallint,jsonb,jsonb) from authenticated;',
          ]
          for (const snippet of requiredSnippets) {
            if (!sql.includes(snippet)) {
              console.error(`Post-deploy privilege lockdown is missing required control: ${snippet}`)
              process.exit(1)
            }
          }
          if (sql.includes('revoke execute on function public.checkout_active_cart_india')) {
            console.error('Customer-scoped India checkout RPC must not be revoked by the compatibility lockdown.')
            process.exit(1)
          }
          console.log('Post-deploy privilege lockdown controls are present and customer checkout remains preserved.')
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
