name: RADVORA Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://kugawqpvfikynithyefa.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RwaaDUGHYP0D7za9Mo8xvg_A9sNhfim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration versions and runtime marker
        shell: bash
        run: |
          set -euo pipefail
          versions=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort)
          duplicates=$(printf '%s\n' "$versions" | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate Supabase migration versions detected:"
            echo "$duplicates"
            exit 1
          fi
          latest=$(printf '%s\n' "$versions" | tail -1)
          node - "$latest" <<'NODE'
          const fs = require('fs')
          const latest = process.argv[2]
          const source = fs.readFileSync('app/api/health/route.ts', 'utf8')
          const match = source.match(/EXPECTED_RUNTIME_SCHEMA_VERSION='([0-9]+)'/)
          if (!match) {
            console.error('Health route does not declare EXPECTED_RUNTIME_SCHEMA_VERSION.')
            process.exit(1)
          }
          if (match[1] !== latest) {
            console.error(`Runtime schema marker ${match[1]} does not match latest migration ${latest}.`)
            process.exit(1)
          }
          console.log(`Runtime schema marker matches latest migration: ${latest}`)
          NODE

      - name: Enforce India-only payment runtime
        shell: bash
        run: |
          set -euo pipefail
          for forbidden in 'STRIPE_' '/api/checkout/stripe' '/api/webhooks/stripe'; do
            if grep -RniF --exclude='*.map' --exclude-dir='.next' --exclude-dir='node_modules' \
              "$forbidden" app lib package.json .env.example 2>/dev/null; then
              echo "Forbidden Stripe runtime/configuration reference found: $forbidden"
              exit 1
            fi
          done
          node - <<'NODE'
          const p = require('./package.json')
          const deps = { ...(p.dependencies || {}), ...(p.devDependencies || {}) }
          if (Object.prototype.hasOwnProperty.call(deps, 'stripe')) {
            console.error('The stripe package must not be present in package.json.')
            process.exit(1)
          }
          console.log('India-only payment runtime check passed.')
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
