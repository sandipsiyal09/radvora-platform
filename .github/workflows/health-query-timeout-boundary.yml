name: RADVORA Health Query Timeout Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-health-query-timeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify health database checks are time-bounded, abortable and fail closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const path = 'app/api/health/route.ts'
          const source = fs.readFileSync(path, 'utf8')
          const required = [
            'const HEALTH_QUERY_TIMEOUT_MS=8000',
            'async function withHealthTimeout<T>(operation:(signal:AbortSignal)=>Promise<T>):Promise<T>',
            'const controller=new AbortController()',
            'setTimeout(()=>controller.abort(),HEALTH_QUERY_TIMEOUT_MS)',
            'return await operation(controller.signal)',
            'clearTimeout(timeout)',
            'await withHealthTimeout(signal=>Promise.all([',
            "database:'unavailable_or_schema_mismatch'",
            'status:503',
          ]
          for (const snippet of required) {
            if (!source.includes(snippet)) {
              console.error(`Health query timeout boundary is missing: ${snippet}`)
              process.exit(1)
            }
          }
          if (source.includes('Promise.race([')) {
            console.error('Health timeout must abort in-flight Supabase requests instead of only racing them.')
            process.exit(1)
          }
          const timeoutMatch = source.match(/const HEALTH_QUERY_TIMEOUT_MS=(\d+)/)
          const timeoutMs = timeoutMatch ? Number(timeoutMatch[1]) : NaN
          if (!Number.isFinite(timeoutMs) || timeoutMs < 1000 || timeoutMs > 10000) {
            console.error('Health database timeout must remain between 1s and 10s.')
            process.exit(1)
          }
          const queryBlockStart = source.indexOf('await withHealthTimeout(signal=>Promise.all([')
          const queryBlockEnd = source.indexOf(']))', queryBlockStart)
          if (queryBlockStart < 0 || queryBlockEnd < queryBlockStart) {
            console.error('Health database checks must remain wrapped by the abortable timeout boundary.')
            process.exit(1)
          }
          const queryBlock = source.slice(queryBlockStart, queryBlockEnd)
          for (const requiredQuery of [
            "supabase.from('products')",
            "supabase.from('order_items')",
            "supabase.from('payment_attempts')",
            "supabase.rpc('server_india_seller_profile_ready')",
            "supabase.rpc('server_runtime_schema_version')",
          ]) {
            if (!queryBlock.includes(requiredQuery)) {
              console.error(`Timeout boundary does not cover required health query: ${requiredQuery}`)
              process.exit(1)
            }
          }
          const abortSignalUses = queryBlock.match(/\.abortSignal\(signal\)/g) || []
          if (abortSignalUses.length !== 5) {
            console.error(`Expected all 5 health Supabase requests to share the abort signal; found ${abortSignalUses.length}.`)
            process.exit(1)
          }
          console.log(`Health database checks abort and fail closed within ${timeoutMs}ms.`)
          NODE
