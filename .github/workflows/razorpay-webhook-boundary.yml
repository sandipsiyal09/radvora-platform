name: RADVORA Razorpay Webhook Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  webhook-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Razorpay webhook request boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const proxy = fs.readFileSync('proxy.ts', 'utf8')
          const route = fs.readFileSync('app/api/webhooks/razorpay/route.ts', 'utf8')

          const proxyRequired = [
            "request.nextUrl.pathname === '/api/webhooks/razorpay'",
            "request.method === 'POST'",
            "request.headers.get('content-type')?.toLowerCase() || ''",
            "contentType.startsWith('application/json')",
            "/^[0-9a-f]{64}$/i.test(signature)",
            "status: 415",
          ]
          for (const snippet of proxyRequired) {
            if (!proxy.includes(snippet)) {
              console.error(`Webhook proxy boundary is missing required control: ${snippet}`)
              process.exit(1)
            }
          }

          const routeRequired = [
            'MAX_BODY_BYTES=256*1024',
            "request.headers.get('content-type')?.toLowerCase()||''",
            "contentType.startsWith('application/json')",
            "request.headers.get('x-razorpay-signature')",
            "/^[0-9a-f]{64}$/i.test(signature)",
            "request.headers.get('x-razorpay-event-id')",
            "createHmac('sha256',secret).update(rawBuffer).digest('hex')",
            'timingSafeEqual(a,b)',
            "claimEvent(admin,eventId,eventType)",
            "if(rawBytes.byteLength>MAX_BODY_BYTES)",
          ]
          for (const snippet of routeRequired) {
            if (!route.includes(snippet)) {
              console.error(`Webhook route is missing required reconciliation control: ${snippet}`)
              process.exit(1)
            }
          }

          const mediaTypeIndex = route.indexOf("contentType.startsWith('application/json')")
          const signatureShapeIndex = route.indexOf('/^[0-9a-f]{64}$/i.test(signature)')
          const bodyReadIndex = route.indexOf('request.arrayBuffer()')
          const hmacIndex = route.indexOf("createHmac('sha256',secret).update(rawBuffer).digest('hex')")
          const parseIndex = route.indexOf('JSON.parse(rawBuffer.toString')
          if (mediaTypeIndex < 0 || signatureShapeIndex < 0 || bodyReadIndex < 0 || hmacIndex < 0 || parseIndex < 0 ||
              mediaTypeIndex > bodyReadIndex || signatureShapeIndex > bodyReadIndex || hmacIndex > parseIndex) {
            console.error('Webhook route must reject invalid media/signature shape before body work and verify raw-body HMAC before JSON parsing.')
            process.exit(1)
          }

          console.log('Razorpay webhook enforces JSON and SHA-256 signature shape in both proxy and route, plus bounded raw-body HMAC verification and event-id replay protection.')
          NODE