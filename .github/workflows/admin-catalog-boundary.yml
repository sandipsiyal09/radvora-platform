name: RADVORA Admin Catalog Boundary

on:
  pull_request:
    paths:
      - 'app/api/admin/catalog/products/[id]/route.ts'
      - '.github/workflows/admin-catalog-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/admin/catalog/products/[id]/route.ts'
      - '.github/workflows/admin-catalog-boundary.yml'

permissions:
  contents: read

jobs:
  admin-catalog-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard privileged catalog runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const routePath = 'app/api/admin/catalog/products/[id]/route.ts'
          const source = fs.readFileSync(routePath, 'utf8')
          const required = [
            "export const runtime='nodejs'",
            'export const maxDuration=10',
            "'Cache-Control':'no-store'",
            "'Pragma':'no-cache'",
            "'X-Content-Type-Options':'nosniff'",
            "'X-Frame-Options':'DENY'",
            "'Referrer-Policy':'no-referrer'",
            "'Cross-Origin-Resource-Policy':'same-origin'",
            "'Permissions-Policy':'camera=(), microphone=(), geolocation=(), payment=(), usb=()'",
            "request.headers.get('sec-fetch-site')?.toLowerCase()==='cross-site'",
            'NEXT_PUBLIC_APP_URL',
            "process.env.VERCEL_ENV==='production'",
            "process.env.NODE_ENV==='production'&&!process.env.VERCEL_ENV",
            "url.protocol==='https:'&&!url.username&&!url.password",
            "hostname!=='localhost'",
            "!hostname.endsWith('.')",
            "hostname.includes('.')",
            "(url.pathname==='/'||url.pathname==='')",
            '!url.search',
            '!url.hash',
            "(url.port===''||url.port==='443')",
            '!Number.isSafeInteger(declaredLength)',
            'declaredLength<0',
            'request.arrayBuffer()',
            "typeof parsed!=='object'||Array.isArray(parsed)",
            'supabase.auth.getUser()',
            "role!=='admin'&&role!=='founder'",
            'server_update_product_catalog',
            'server_set_product_india_tax_config',
            'server_set_product_inventory',
            'server_set_product_commerce_enabled',
            "console.error('server_catalog_update_failed')",
            "console.error('server_product_tax_config_failed')",
            "console.error('server_product_inventory_failed')",
            "console.error('server_product_commerce_toggle_failed')",
          ]
          for (const snippet of required) {
            if (!source.includes(snippet)) {
              console.error(`Admin catalog boundary is missing required control: ${snippet}`)
              process.exit(1)
            }
          }
          for (const unsafe of [
            "console.error('server_catalog_update_failed',error)",
            "console.error('server_product_tax_config_failed',error)",
            "console.error('server_product_inventory_failed',error)",
            "console.error('server_product_commerce_toggle_failed',error)",
          ]) {
            if (source.includes(unsafe)) {
              console.error(`Privileged catalog writes must not log raw caught database errors: ${unsafe}`)
              process.exit(1)
            }
          }
          const maxDuration = Number(source.match(/export const maxDuration\s*=\s*(\d+)/)?.[1] || 0)
          if (maxDuration < 1 || maxDuration > 15) {
            console.error(`Admin catalog maxDuration must remain bounded to 1-15 seconds; found ${maxDuration || 'missing'}`)
            process.exit(1)
          }
          console.log('Privileged catalog/tax/inventory/commerce writes require admin/founder auth, exact production origin, bounded validated JSON, hardened responses, safe logging, and governed server RPCs.')
          NODE
