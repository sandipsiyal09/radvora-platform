name: RADVORA Privileged Admin MFA Boundary

on:
  pull_request:
    paths:
      - 'proxy.ts'
      - 'app/security/mfa/**'
      - 'app/api/admin/**'
      - 'supabase/migrations/**'
      - '.github/workflows/admin-mfa-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'proxy.ts'
      - 'app/security/mfa/**'
      - 'app/api/admin/**'
      - 'supabase/migrations/**'
      - '.github/workflows/admin-mfa-boundary.yml'

permissions:
  contents: read

jobs:
  privileged-mfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify admin AAL2 enforcement and enrollment flow
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const proxy = fs.readFileSync('proxy.ts', 'utf8')
          const page = fs.readFileSync('app/security/mfa/page.tsx', 'utf8')
          const form = fs.readFileSync('app/security/mfa/mfa-form.tsx', 'utf8')
          const rls = fs.readFileSync('supabase/migrations/202609110050_require_aal2_for_admin_rls.sql', 'utf8')

          const requiredProxy = [
            "pathname === '/admin'",
            "pathname.startsWith('/api/admin/')",
            'getAuthenticatorAssuranceLevel()',
            "assurance.currentLevel !== 'aal2'",
            "status: 428",
            "new URL('/security/mfa'",
          ]
          for (const token of requiredProxy) {
            if (!proxy.includes(token)) throw new Error(`Missing privileged MFA proxy guard: ${token}`)
          }
          if (!proxy.includes("role !== 'admin' && role !== 'founder'")) {
            throw new Error('Privileged proxy must retain admin/founder role enforcement.')
          }

          for (const token of ["role!=='admin'&&role!=='founder'", "currentLevel==='aal2'", "redirect(next)"]) {
            if (!page.includes(token)) throw new Error(`Missing MFA page server guard: ${token}`)
          }
          for (const token of ['mfa.enroll(', 'mfa.listFactors()', 'mfa.challenge(', 'mfa.verify(', "currentLevel!=='aal2'"]) {
            if (!form.includes(token)) throw new Error(`Missing MFA client flow control: ${token}`)
          }
          if (!form.includes("factorType:'totp'")) throw new Error('Privileged MFA enrollment must use TOTP.')

          const expectedPolicies = [
            'admins_read_agent_guardrails',
            'admins_read_agents',
            'admins_read_approvals',
            'admins_read_audit_logs',
            'claims_read_public_or_admin',
            'lab_reports_read_public_or_admin',
            'rf_tests_read_public_or_admin',
            'orders_read_owner_or_admin',
            'order_items_read_owner_or_admin',
            'payment_attempts_read_owner_or_admin',
            'refund_attempts_read_owner_or_admin',
            'support_tickets_read_owner_or_admin',
            'warranty_claims_read_owner_or_admin',
            'admins_insert_products',
            'admins_update_products',
            'admins_update_support_tickets',
            'admins_update_warranty_claims',
          ]
          if (!rls.includes("((select auth.jwt())->>'aal')='aal2'") && !rls.includes("((select auth.jwt())->>'aal') = 'aal2'")) {
            throw new Error('AAL2 JWT requirement is missing from privileged RLS migration.')
          }
          for (const policy of expectedPolicies) {
            if (!rls.includes(policy)) throw new Error(`Privileged RLS migration does not cover policy ${policy}`)
          }
          if (!rls.includes("select '202609110050'::text")) throw new Error('Runtime schema marker was not advanced with the AAL2 RLS migration.')
          console.log('Privileged admin AAL2/TOTP boundary is present in proxy, UI, API boundary and RLS migration.')
          NODE
